<svg xmlns="http://www.w3.org/2000/svg" width="490" height="370" viewBox="0 0 490 370">
  <style>
    .bg { fill: #0d1117; rx: 8px; stroke: #30363d; stroke-width: 1px; }
    .title-bar { fill: #161b22; rx: 8px; }
    .title { font-family: 'Fira Code', monospace; font-size: 13px; fill: #8b949e; font-weight: 600; }
    .text { font-family: 'Fira Code', monospace; font-size: 12.5px; fill: #c9d1d9; }
    .key { fill: #58a6ff; font-weight: 600; }
    .line { opacity: 0; animation: fadeIn 0.4s ease-out forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .l1 { animation-delay: 0.1s; }
    .l2 { animation-delay: 0.25s; }
    .l3 { animation-delay: 0.4s; }
    .l4 { animation-delay: 0.55s; }
    .l5 { animation-delay: 0.7s; }
    .l6 { animation-delay: 0.85s; }
    .l7 { animation-delay: 1.0s; }
  </style>
  <rect width="490" height="370" class="bg" />
  <path d="M 0,0 L 490,0 L 490,32 L 0,32 Z" class="title-bar" />
  <circle cx="20" cy="16" r="5" fill="#ff5f56" />
  <circle cx="36" cy="16" r="5" fill="#ffbd2e" />
  <circle cx="52" cy="16" r="5" fill="#27c93f" />
  <text x="70" y="20" class="title">jayesh@terminal ~ neofetch</text>
  <g transform="translate(20, 55)">
    <g class="line l1">
      <text x="0" y="15" class="text" fill="#3fb950" font-weight="bold">jayesh@backend-ai</text>
      <text x="0" y="27" class="text" fill="#30363d">-----------------------------------</text>
    </g>
    <g class="line l2" transform="translate(0, 40)">
      <text x="0" y="0" class="text"><tspan class="key">OS:</tspan> AI / Backend Engineering</text>
    </g>
    <g class="line l3" transform="translate(0, 65)">
      <text x="0" y="0" class="text"><tspan class="key">Focus:</tspan> Generative AI, RAG &amp; Robust Backends</text>
    </g>
    <g class="line l4" transform="translate(0, 90)">
      <text x="0" y="0" class="text"><tspan class="key">Stack:</tspan> Python, FastAPI, LangChain, GCP, Docker</text>
    </g>
    <g class="line l5" transform="translate(0, 115)">
      <text x="0" y="0" class="text"><tspan class="key">Now:</tspan> Grinding LeetCode + Tech Videos</text>
    </g>
    <g class="line l6" transform="translate(0, 140)">
      <text x="0" y="0" class="text"><tspan class="key">YouTube:</tspan> @jey_script (Learning in Public)</text>
    </g>
    <g class="line l7" transform="translate(0, 165)">
      <text x="0" y="0" class="text"><tspan class="key">Portfolio:</tspan> jayesh-pf.me</text>
    </g>
  </g>
</svg>